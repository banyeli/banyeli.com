<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banyeli Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="world">
      <div class="cosmos" aria-hidden="true"><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="mist mist-a"></i><i class="mist mist-b"></i></div>
      <nav class="rail" aria-label="Banyeli"><a class="mark" href="#home" aria-label="Banyeli">b</a><span></span><a href="#vault" aria-label="Private vault">◇</a></nav>
      <header><span class="live"><i></i> private line</span><button class="sound" type="button">sound off</button></header>
      <section id="home" class="arrival">
        <article class="presence"><video class="chief-video" autoplay muted loop playsinline aria-label="Banyeli"><source src="assets/banyeli-chief-of-staff.mp4" type="video/mp4" /></video><div class="video-fade"></div><div class="presence-label"><span>01</span><p>Banyeli<br />with you</p></div></article>
        <div class="space">
          <p class="whisper">You made it.</p>
          <h1>Begin<br /><em>anywhere.</em></h1>
          <form class="thought-form"><label class="sr-only" for="thought">Speak with Banyeli</label><input id="thought" autocomplete="off" placeholder="What is on your mind?" /><button type="submit" aria-label="Send">↑</button></form>
          <p class="reply" aria-live="polite">She is listening.</p>
          <p class="corner-note">Just for you.</p>
        </div>
      </section>
      <section id="vault" class="below"><p>Keep a thought<br /><em>close.</em></p><span>↓</span></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
